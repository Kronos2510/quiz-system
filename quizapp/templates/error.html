{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block mainclass %}page page-narrow{% endblock %}

{% block content %}
<section class="centered-card error-card">
  <span class="error-code">{{ code }}</span>
  <h1>{{ title }}</h1>
  <p class="muted lede">{{ message }}</p>
  <div class="row gap-3 wrap center">
    {% if user %}
      <a class="btn btn-primary" href="/">Go to my dashboard</a>
    {% else %}
      <a class="btn btn-primary" href="/login">Sign in</a>
    {% endif %}
    <a class="btn btn-ghost" href="/">Back to home</a>
  </div>
</section>
{% endblock %}
